<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store - Professional Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> 1-Click Direct Console
            </h1>
            <span class="text-sm bg-green-900 text-green-300 px-3 py-1 rounded-full border border-green-700">Auto-Converter Active</span>
        </div>
    </nav>

    <!-- Main Grid -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- App Upload Form -->
        <div class="lg:col-span-1 bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl h-fit">
            <h2 class="text-lg font-semibold mb-4 text-white flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-indigo-400"></i> Add New App (1-Click)
            </h2>
            
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">App Name</label>
                    <input type="text" id="appName" required placeholder="e.g. Targetzone Pro" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Category</label>
                    <select id="appCategory" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500 text-sm">
                        <option value="Tools">Tools</option>
                        <option value="Games">Games</option>
                        <option value="Social">Social</option>
                        <option value="Music">Music/Video</option>
                        <option value="Productivity">Productivity</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Description</label>
                    <textarea id="appDesc" rows="3" required placeholder="Describe app features..." class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500 text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">App Icon Image URL</label>
                    <input type="url" id="appIconUrl" required placeholder="Paste Google Drive image link or any direct image link" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    <p class="text-[10px] text-gray-400 mt-1">Upload logo to Google Drive, share as public, and paste link here.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Google Drive APK Share Link</label>
                    <input type="url" id="appApkUrl" required placeholder="https://drive.google.com/file/d/..." class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    <p class="text-[10px] text-gray-400 mt-1">Upload APK to Google Drive, set sharing to 'Anyone with link', and paste here.</p>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 px-4 rounded text-sm font-semibold transition-colors flex justify-center items-center gap-2">
                    <i class="fa-solid fa-share-from-square"></i> Add App to Store
                </button>
            </form>
        </div>

        <!-- Manage Apps Section -->
        <div class="lg:col-span-2 bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-white flex items-center gap-2">
                <i class="fa-solid fa-list text-indigo-400"></i> Live Store Apps
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="text-xs uppercase bg-gray-700 text-gray-400 border-b border-gray-600">
                        <tr>
                            <th class="px-4 py-3">Icon</th>
                            <th class="px-4 py-3">App Name</th>
                            <th class="px-4 py-3">Category</th>
                            <th class="px-4 py-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="appTableBody" class="divide-y divide-gray-700">
                        <!-- Database Rows -->
                    </tbody>
                </table>
                <div id="noAppsMsg" class="text-center py-8 text-gray-500 hidden">No apps listed yet.</div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDnlRTIAVnlkEqvdadepWl8KC55eTCSFMc",
            authDomain: "my-apk-store-59991.firebaseapp.com",
            projectId: "my-apk-store-59991",
            storageBucket: "my-apk-store-59991.firebasestorage.app",
            messagingSenderId: "997005361021",
            appId: "1:997005361021:web:0d1c13bc50b472a9c95614",
            measurementId: "G-2MD7JF2JVB"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const appTableBody = document.getElementById('appTableBody');
        const noAppsMsg = document.getElementById('noAppsMsg');

        // Function to extract Google Drive file ID and convert to direct download URL
        function convertToDirectDownloadLink(gDriveUrl) {
            const regExp = /(?:https?:\/\/)?(?:drive\.google\.com)\/(?:file\/d\/|open\?id=)([a-zA-Z0-9-_]+)/;
            const matches = gDriveUrl.match(regExp);
            if (matches && matches[1]) {
                // Generates direct download api URL
                return `https://docs.google.com/uc?export=download&id=${matches[1]}`;
            }
            return gDriveUrl; // Returns original if not a google drive link
        }

        // Form Submit
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const appName = document.getElementById('appName').value;
            const appCategory = document.getElementById('appCategory').value;
            const appDesc = document.getElementById('appDesc').value;
            const rawIconUrl = document.getElementById('appIconUrl').value;
            const rawApkUrl = document.getElementById('appApkUrl').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Converting Link...`;

            try {
                // Auto-convert both image and APK links to direct download URLs
                const iconDirectUrl = convertToDirectDownloadLink(rawIconUrl);
                const apkDirectUrl = convertToDirectDownloadLink(rawApkUrl);

                // Save converted links to Firestore Database
                await db.collection('apps').add({
                    name: appName,
                    category: appCategory,
                    description: appDesc,
                    iconUrl: iconDirectUrl,
                    apkUrl: apkDirectUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Successfully Published! App added to store with 1-Click download.');
                uploadForm.reset();
            } catch (error) {
                console.error(error);
                alert('Database Error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-share-from-square"></i> Add App to Store`;
            }
        });

        // Sync local list table in Real-time
        db.collection('apps').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
            appTableBody.innerHTML = '';
            if (snapshot.empty) {
                noAppsMsg.classList.remove('hidden');
                return;
            }
            noAppsMsg.classList.add('hidden');

            snapshot.forEach((doc) => {
                const app = doc.data();
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-700/50 transition-colors';
                tr.innerHTML = `
                    <td class="px-4 py-3">
                        <img src="${app.iconUrl}" alt="" onerror="this.src='https://placehold.co/40x40/555/fff?text=App'" class="w-10 h-10 rounded-lg object-cover">
                    </td>
                    <td class="px-4 py-3 font-semibold text-white">${app.name}</td>
                    <td class="px-4 py-3 text-xs text-gray-400">
                        <span class="bg-gray-700 px-2 py-1 rounded">${app.category}</span>
                    </td>
                    <td class="px-4 py-3 text-right">
                        <button onclick="deleteApp('${doc.id}')" class="text-red-400 hover:text-red-500 transition-colors text-sm">
                            <i class="fa-solid fa-trash-can"></i> Delete
                        </button>
                    </td>
                `;
                appTableBody.appendChild(tr);
            });
        });

        // Delete App function
        async function deleteApp(id) {
            if (confirm('Delete this app?')) {
                try {
                    await db.collection('apps').doc(id).delete();
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }
        }
    </script>
</body>
</html>
